
name: Extract and Build Milk Hisab APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK Packages
        run: |
          sdkmanager "platforms;android-33"
          sdkmanager "build-tools;33.0.2"
          sdkmanager "platform-tools"

      - name: Extract Source ZIP
        run: |
          mkdir -p project
          unzip -q MilkHisab_GitHub_Actions_Source.zip -d project
          echo "Source extracted successfully"
          ls -la project

      - name: Setup Gradle 7.6.4
        run: |
          curl -L https://services.gradle.org/distributions/gradle-7.6.4-bin.zip -o gradle.zip
          unzip -q gradle.zip -d /tmp
          /tmp/gradle-7.6.4/bin/gradle --version

      - name: Build Android APK
        working-directory: project
        run: |
          /tmp/gradle-7.6.4/bin/gradle --no-daemon assembleDebug

      - name: Check APK
        run: |
          ls -lh project/app/build/outputs/apk/debug/
          test -f project/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Milk-Hisab-APK
          path: project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
          
